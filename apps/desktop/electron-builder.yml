# Pinned to what is installed: electron-builder downloads platform binaries for
# an exact release and cannot resolve a range.
electronVersion: "43.4.0"

appId: com.aronmatoic.stlmanager
productName: STL Manager
copyright: Copyright 2026 aronmatoic

directories:
  output: release
  buildResources: build

# The workspace packages are bundled into the main process by electron-vite, so
# the packaged application needs nothing from node_modules.
files:
  - out/**/*
  - package.json

mac:
  category: public.app-category.utilities
  icon: build/icon.icns
  target:
    - target: dmg
      arch: [arm64, x64]
    - target: zip
      arch: [arm64, x64]
  # Required for notarisation.
  hardenedRuntime: true
  entitlements: build/entitlements.mac.plist
  entitlementsInherit: build/entitlements.mac.plist
  # Notarisation happens in the afterSign hook so it can be skipped cleanly
  # when no credentials are configured.
  notarize: false
  gatekeeperAssess: false

dmg:
  title: STL Manager
  contents:
    - x: 140
      y: 200
      type: file
    - x: 400
      y: 200
      type: link
      path: /Applications

afterSign: build/notarize.cjs
