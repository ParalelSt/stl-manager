# Pinned to what is installed: electron-builder downloads platform binaries for
# an exact release and cannot resolve a range.
electronVersion: "43.4.0"

appId: com.aronmatoic.stlmanager
productName: STL Manager
copyright: Copyright 2026 aronmatoic

directories:
  output: release
  buildResources: build

# The workspace packages are bundled into the main process by electron-vite, so
# the packaged application needs nothing from node_modules.
files:
  - out/**/*
  - package.json

mac:
  category: public.app-category.utilities
  icon: build/icon.icns
  # A dmg only. The zip target exists to feed an auto-updater, and there is
  # no updater here, so it would only double the size of every release.
  target:
    - target: dmg
      arch: [arm64, x64]
  # Required for notarisation.
  hardenedRuntime: true
  entitlements: build/entitlements.mac.plist
  entitlementsInherit: build/entitlements.mac.plist
  # Notarisation happens in the afterSign hook so it can be skipped cleanly
  # when no credentials are configured.
  notarize: false
  gatekeeperAssess: false

linux:
  # The workspace name would otherwise put a slash in the filename.
  artifactName: "STL-Manager-${version}-${arch}.${ext}"
  # The workspace is called @stl-manager/desktop, which is not a usable name
  # for a Linux binary, so the executable is named explicitly.
  executableName: stl-manager
  icon: build/icon.png
  category: Utility
  synopsis: Sort 3D model files into one structured library
  target:
    - target: AppImage
      arch: [x64, arm64]
    - target: deb
      arch: [x64, arm64]

win:
  icon: build/icon.png
  target:
    - target: nsis
      arch: [x64]
    - target: zip
      arch: [x64]

nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true

dmg:
  title: STL Manager
  contents:
    - x: 140
      y: 200
      type: file
    - x: 400
      y: 200
      type: link
      path: /Applications

afterSign: build/notarize.cjs
