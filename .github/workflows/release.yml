# Builds an application for each operating system and a container image for
# both architectures, and attaches them to a release.
#
# Triggered by pushing a tag such as v0.2.0. Nothing is published on an
# ordinary push, so a release is always deliberate.
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write
  packages: write

jobs:
  desktop:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      # One failing platform should not hide whether the others built.
      fail-fast: false
      matrix:
        # macOS and Linux only. The engine's path handling is POSIX throughout,
        # so a Windows build would mis-sort rather than merely be untested.
        include:
          - os: macos-latest
            script: package
          - os: ubuntu-latest
            script: package:linux
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm test
      - name: Package
        run: npm run ${{ matrix.script }} -w apps/desktop
        env:
          # Signing only happens where a certificate is configured. Without
          # one the build still produces a working application, unsigned.
          # Auto-discovery is off because otherwise electron-builder finds no
          # certificate on the runner, tries to sign with an empty one, and
          # fails the build rather than leaving it unsigned.
          CSC_IDENTITY_AUTO_DISCOVERY: false
          CSC_LINK: ${{ secrets.MAC_CERTIFICATE }}
          CSC_KEY_PASSWORD: ${{ secrets.MAC_CERTIFICATE_PASSWORD }}
      - uses: actions/upload-artifact@v4
        with:
          name: desktop-${{ matrix.os }}
          path: |
            apps/desktop/release/*.dmg
            apps/desktop/release/*.zip
            apps/desktop/release/*.AppImage
            apps/desktop/release/*.deb
            apps/desktop/release/*.exe
          if-no-files-found: warn

  image:
    name: Container image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # A container registry refuses an uppercase name, and the repository
      # owner here is not lowercase.
      - name: Work out the image name
        id: image
        run: echo "name=$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"
      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/server/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: ${{ startsWith(github.ref, 'refs/tags/') }}
          tags: |
            ghcr.io/${{ steps.image.outputs.name }}:latest
            ghcr.io/${{ steps.image.outputs.name }}:${{ github.ref_name }}

  publish:
    name: Attach to the release
    needs: [desktop, image]
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - uses: softprops/action-gh-release@v2
        with:
          files: artifacts/**/*
          generate_release_notes: true
